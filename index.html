<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <title>Phasmophobia Fantasmas</title>

  <style>
    html, body {
      min-height: 100vh;
    }

    #page {
      position: relative;
      z-index: 1;
    }

    body {
      background-image: url("img/fondo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    #progressContainer {
      width: 80%;
      max-width: 600px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 0 auto 20px auto;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      border-radius: 10px;
      transition: width 0.5s ease-in-out;
    }

    #counter {
      text-align: center;
      font-family: 'Cinzel', serif;
      opacity: 0.85;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 40px;
      max-width: 1600px;
      margin: auto;
    }

    .ghost {
      position: relative;
      cursor: pointer;
    }

    .ghost img {
      width: 100%;
      height: 110px;
      max-width: 160px;
      object-fit: contain;
      border-radius: 10px;
      transition: 0.2s;
    }

    .ghost:hover img {
      filter: brightness(1.4) drop-shadow(0 0 12px rgba(255,255,255,0.6));
      transform: scale(1.03);
    }

    .ghost.checked img {
      filter: grayscale(100%) brightness(20%);
    }

    .ghost.checked:hover img {
      filter: grayscale(100%) brightness(35%)
              drop-shadow(0 0 12px rgba(255,255,255,0.6));
      transform: scale(1.03);
    }

    @keyframes shake {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-4px, 2px); }
      40%  { transform: translate(4px, -2px); }
      60%  { transform: translate(-4px, -2px); }
      80%  { transform: translate(4px, 2px); }
      100% { transform: translate(0, 0); }
    }

    #page.shake {
      animation: shake 0.3s;
    }

    /* Nueva parte para el modal de la lista */
    #listButton {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 10px 20px;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      z-index: 1000;
    }

    #listButton:hover {
      background-color: rgba(255, 215, 0, 0.8);
    }

    #listButton:active {
      transform: scale(0.95);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 600px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    ul li {
      margin: 10px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="page">

<h1>Phasmophobia Fantasmas</h1>

<div id="progressContainer">
  <div id="progressBar"></div>
</div>

<div id="counter">0 de 27 Fantasmas</div>

<div class="grid">
  <div class="ghost"><img src="/Phasmo-Lista/img/banshee.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/demonio.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/ente.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/espectro.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/espiritu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/gallu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/gemelos.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/goryo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/hantu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/jinn.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/mimico.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/moroi.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/myling.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/obake.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/obambo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/oni.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/onryo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/pesadilla.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/poltergeist.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/raiju.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/revenant.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/sombra.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/thaye.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/yokai.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/yurei.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/deogen.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/dayan.png"></div>
</div>

</div>

<button id="resetButton">RESET</button>

<!-- Nuevo botón "Lista" -->
<button id="listButton">Lista</button>

<!-- Modal de Lista -->
<div id="listModal" class="modal">
  <div class="modal-content">
    <span id="closeModal" class="close">&times;</span>
    <h2>Lista de Fantasmas</h2>

    <h3>Fantasmas Encontrados</h3>
    <ul id="foundList"></ul>

    <h3>Fantasmas No Encontrados</h3>
    <ul id="notFoundList"></ul>
  </div>
</div>

<audio id="clickSound" src="img/click.mp3" preload="auto"></audio>

<script>
  const clickSound = document.getElementById("clickSound");
  const page = document.getElementById("page");
  const counter = document.getElementById("counter");
  const progressBar = document.getElementById("progressBar");
  const resetButton = document.getElementById("resetButton");
  const listButton = document.getElementById("listButton");
  const listModal = document.getElementById("listModal");
  const closeModal = document.getElementById("closeModal");
  const foundList = document.getElementById("foundList");
  const notFoundList = document.getElementById("notFoundList");
  const ghosts = document.querySelectorAll(".ghost");

  resetButton.addEventListener("click", () => {
    resetButton.classList.add("clicked");
    setTimeout(() => resetButton.classList.remove("clicked"), 300);

    document.querySelectorAll(".ghost").forEach(ghost => {
      ghost.classList.remove("checked");
      const key = "phasmo_" + Array.from(ghost.parentElement.children).indexOf(ghost);
      localStorage.removeItem(key);
    });

    progressBar.style.width = "0%";
    counter.textContent = "0 de 27 Fantasmas";
    counter.style.color = "white";
  });

  listButton.addEventListener("click", () => {
    listModal.style.display = "block";
    updateLists();
  });

  closeModal.addEventListener("click", () => {
    listModal.style.display = "none";
  });

  function updateLists() {
    foundList.innerHTML = "";
    notFoundList.innerHTML = "";

    ghosts.forEach((ghost, index) => {
      const ghostName = ghost.querySelector('img').src.split('/').pop().replace('.png', '');
      const listItem = document.createElement("li");
      listItem.textContent = ghostName.charAt(0).toUpperCase() + ghostName.slice(1);

      if (ghost.classList.contains("checked")) {
        foundList.appendChild(listItem);
      } else {
        notFoundList.appendChild(listItem);
      }
    });
  }

  ghosts.forEach((ghost, index) => {
    const key = "phasmo_" + index;

    if (localStorage.getItem(key) === "true") {
      ghost.classList.add("checked");
    }

    ghost.onclick = () => {
      ghost.classList.toggle("checked");
      localStorage.setItem(key, ghost.classList.contains("checked"));

      clickSound.currentTime = 0;
      clickSound.play();

      page.classList.add("shake");
      setTimeout(() => {
        page.classList.remove("shake");
      }, 300);

      updateCounter();
    };
  });

  function updateCounter() {
    const checked = document.querySelectorAll(".ghost.checked").length;
    const winSound = new Audio('img/logro.mp3');
    let porcentaje = (checked / 27) * 100;
    progressBar.style.width = porcentaje + "%";

    if (checked === 27) {
      counter.textContent = "¡Todos los fantasmas encontrados!";
      counter.style.color = "#FFD700";
      winSound.play();
    } else {
      counter.textContent = `${checked} de 27 Fantasmas`;
      counter.style.color = "white";
    }
  }

  updateCounter();
</script>

<div id="footer">Made by Rozti</div>

</body>
</html>
