<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <title>Phasmophobia Fantasmas</title>

  <style>

html, body {
  min-height: 100vh;
}

#page {
  position: relative;
  z-index: 1;
}
    
    body {
      background-image: url("img/fondo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    #progressContainer {
      width: 80%;
      max-width: 600px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 0 auto 20px auto;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      border-radius: 10px;
      transition: width 0.5s ease-in-out;
    }

    #counter {
      text-align: center;
      font-family: 'Cinzel', serif;
      opacity: 0.85;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 40px;
      max-width: 1600px;
      margin: auto;
    }

    .ghost {
      position: relative;
      cursor: pointer;
    }

    .ghost img {
      width: 100%;
      height: 110px;
      max-width: 160px;
      object-fit: contain;
      border-radius: 10px;
      transition: 0.2s;
    }

    .ghost:hover img {
      filter: brightness(1.4) drop-shadow(0 0 12px rgba(255,255,255,0.6));
      transform: scale(1.03);
    }
    
    .ghost.checked img {
      filter: grayscale(100%) brightness(20%);
    }

    .ghost.checked:hover img {
      filter: grayscale(100%) brightness(35%)
              drop-shadow(0 0 12px rgba(255,255,255,0.6));
      transform: scale(1.03);
    }
    
    @keyframes shake {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-4px, 2px); }
      40%  { transform: translate(4px, -2px); }
      60%  { transform: translate(-4px, -2px); }
      80%  { transform: translate(4px, 2px); }
      100% { transform: translate(0, 0); }
    }
    
    #page.shake {
      animation: shake 0.3s;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,0.65) 100%
      );
      z-index: 999;
      animation: breathe 10s infinite alternate ease-in-out;
    }
    
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.02); opacity: 0.7; }
    }
    
    @keyframes flicker {
      0%   { opacity: 1; }
      20%  { opacity: 0.3; }
      40%  { opacity: 1; }
      60%  { opacity: 0.4; }
      80%  { opacity: 1; }
      100% { opacity: 1; }
    }

    body.flicker::after {
      animation: flicker 0.6s, breathe 10s infinite alternate ease-in-out;
    }

    #footer {
      position: fixed;
      bottom: 10px;      
      width: 100%;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      pointer-events: none;  
      z-index: 1000;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-5px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-3px); }
    }

    .particle {
      position: fixed;
      top: 100%;
      border-radius: 50%;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.3; }
      100% { transform: translateY(-110vh) scale(0.5); opacity: 0; }
     }
    
     @keyframes glow {
       0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 0px white); }
       50% { opacity: 1; filter: drop-shadow(0 0 8px white); }
     }

     .gold-particle {
       position: fixed;
       top: 100%;
       border-radius: 50%;
       background: gold;
       width: 6px;
       height: 6px;
       pointer-events: none;
       animation: floatUpGold linear infinite;
       z-index: 1000;
     }

     @keyframes floatUpGold {
       0% { transform: translateY(0) scale(1); opacity: 0; }
       20% { opacity: 1; }
       100% { transform: translateY(-110vh) scale(0.5); opacity: 0; }
     }

     #logroImagen {
       position: fixed;
       top: 50%;
       left: 50%;
       transform: translate(-50%, -50%);
       z-index: 1001;
       display: none;
       max-width: 300px;
       max-height: 300px;
       pointer-events: none;
     }
  </style>
</head>
<body>

<div id="page">

<h1>Phasmophobia Fantasmas</h1>

<div id="progressContainer">
  <div id="progressBar"></div>
</div>

<div id="counter">0 de 27 Fantasmas</div>

<div class="grid">

  <div class="ghost"><img src="/Phasmo-Lista/img/banshee.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/demonio.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/ente.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/espectro.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/espiritu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/gallu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/gemelos.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/goryo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/hantu.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/jinn.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/mimico.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/moroi.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/myling.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/obake.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/obambo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/oni.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/onryo.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/pesadilla.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/poltergeist.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/raiju.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/revenant.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/sombra.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/thaye.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/yokai.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/yurei.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/deogen.png"></div>
  <div class="ghost"><img src="/Phasmo-Lista/img/dayan.png"></div>
</div>

</div>

<audio id="clickSound" src="img/click.mp3" preload="auto"></audio>

<script>
  const clickSound = document.getElementById("clickSound");
  const page = document.getElementById("page");
  const counter = document.getElementById("counter");

  const NUM_PARTICLES = 70; // cantidad de partículas
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const p = document.createElement("div");
    p.classList.add("particle");

    // posición horizontal aleatoria
    p.style.left = Math.random() * 100 + "%";

    // tamaño aleatorio
    const size = Math.random() * 5 + 3;
    p.style.width = size + "px";
    p.style.height = size + "px";

    // opacidad aleatoria
    p.style.background = `rgba(255,255,255,${Math.random() * 0.5 + 0.3})`;

    // duración aleatoria
    const duration = Math.random() * 15 + 10;
    p.style.animationDuration = duration + "s";

    // retraso aleatorio
    p.style.animationDelay = Math.random() * 15 + "s";

    // 20% de las partículas brillarán
    if (Math.random() < 0.2) { 
      p.style.animationName = "floatUp, glow";
      p.style.animationDuration = `${duration}s, ${Math.random() * 3 + 2}s`;
      p.style.animationIterationCount = "infinite, infinite";
      p.style.animationTimingFunction = "linear, ease-in-out";
    }

    document.body.appendChild(p);
  }

  function updateCounter() {
    const checked = document.querySelectorAll(".ghost.checked").length;
    const winSound = new Audio('img/logro.mp3');

    let porcentaje = (checked / 27) * 100;
    progressBar.style.width = porcentaje + "%";

    document.querySelectorAll('.gold-particle').forEach(p => p.remove());

    if (checked === 27) {
    counter.textContent = "¡Todos los fantasmas encontrados!";
    counter.style.color = "#FFD700"; // dorado brillante
    winSound.play();

    for (let i = 0; i < 50; i++) {
      const p = document.createElement("div");
      p.classList.add("gold-particle");
      p.style.left = Math.random() * 100 + "%";
      const size = Math.random() * 6 + 4;
      p.style.width = size + "px";
      p.style.height = size + "px";
      const duration = Math.random() * 5 + 5;
      p.style.animationDuration = duration + "s";
      p.style.animationDelay = Math.random() * 2 + "s";
      document.body.appendChild(p);
    }
    
  } else {
    counter.textContent = `${checked} de 27 Fantasmas`;
    counter.style.color = "white";
    // ocultar imagen y borrar partículas si no está completo
    document.querySelectorAll('.gold-particle').forEach(p => p.remove());
  }
}
  
  document.querySelectorAll(".ghost").forEach((ghost, index) => {
    const key = "phasmo_" + index;

    if (localStorage.getItem(key) === "true") {
      ghost.classList.add("checked");
    }

    ghost.onclick = () => {
      ghost.classList.toggle("checked");
      localStorage.setItem(key, ghost.classList.contains("checked"));

      clickSound.currentTime = 0;
      clickSound.play();

      page.classList.add("shake");
      setTimeout(() => {
        page.classList.remove("shake");
      }, 300);

      document.body.classList.add("flicker");
      setTimeout(() => {
        document.body.classList.remove("flicker");
      }, 600);

      updateCounter();
    };
  });
  
  updateCounter();
</script>

  <div id="footer">Made by Rozti</div>

</body>
</html>
