<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Phasmophobia – Lista de Fantasmas</title>

  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .ghost {
      position: relative;
      cursor: pointer;
    }

    .ghost img {
      width: 100%;
      display: block;
      border-radius: 6px;
    }

    .ghost.checked img {
      filter: grayscale(100%) brightness(40%);
    }

    .ghost::after {
      content: "✖";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      color: red;
      display: none;
      pointer-events: none;
    }

    .ghost.checked::after {
      display: block;
    }

    button {
      display: block;
      margin: 30px auto;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Phasmophobia – Fantasmas</h1>

<div class="grid" id="ghostGrid"></div>

<button onclick="resetList()">Resetear lista</button>

<script>
  const ghosts = [
    "banshee","demonio","hantu","moroi","obambo","ente","revenant","thaye","espectro",
    "dayan","gallu","jinn","myling","oni","poltergeist","sombra","mimico","yokai",
    "deogen","goryo","pesadilla","obake","onryo","raiju","espiritu","gemelos","yurei"
  ];

  const grid = document.getElementById("ghostGrid");
  const saved = JSON.parse(localStorage.getItem("phasmo")) || {};

  ghosts.forEach(name => {
    const div = document.createElement("div");
    div.className = "ghost";
    if (saved[name]) div.classList.add("checked");

    div.innerHTML = `<img src="img/${name}.png" alt="${name}">`;

    div.onclick = () => {
      div.classList.toggle("checked");
      saved[name] = div.classList.contains("checked");
      localStorage.setItem("phasmo", JSON.stringify(saved));
    };

    grid.appendChild(div);
  });

  function resetList() {
    localStorage.removeItem("phasmo");
    location.reload();
  }
</script>

</body>
</html>
